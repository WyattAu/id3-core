[package]
name = "id3-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "ID3v1/ID3v2 audio tag reader and writer — v2.2/2.3/2.4 frames, CHAP/CTOC chapters, APIC art, unsynchronisation, no_std"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/id3-core"
keywords = ["id3", "audio", "metadata", "tags", "chapters", "no-std"]
categories = ["multimedia::audio", "parser-implementations", "no-std"]
exclude = [".github/", "fuzz/"]

[features]
default = []
# `std` unlocks `std::error::Error` and the owned-`String` conveniences. The
# parser itself is `#![no_std]` + `alloc` either way.
std = []

[dependencies]
# Sole runtime dependency: the typed error, in the same shape as every other
# L0 kit in the estate (can-core, dbc-parse, dsp-core). Keeping this at one
# `no_std`-capable dependency is what holds the L0 no-deps discipline.
thiserror = { version = "2", default-features = false }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[package.metadata.layers]
tier = "L0"