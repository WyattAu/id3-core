name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@main
    with:
      estate-siblings: "mp4-core"
      estate-siblings-token: ${{ secrets.ESTATE_SIBLINGS_TOKEN }}
      tier: a
      all-features: true
      embedded: true
